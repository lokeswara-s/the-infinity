name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Build
        run: dotnet build TheInfinity.slnx -c Release

      - name: Test
        run: dotnet test TheInfinity.slnx -c Release --no-build

      - name: Publish self-contained build
        run: ./installer/publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TheInfinity-win-x64
          path: dist/win-x64
